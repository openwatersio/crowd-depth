name: Grid

on:
  pull_request:
    paths: ["packages/grid/**", ".github/workflows/grid.yml"]
  push:
    branches: [main]
    paths: ["packages/grid/**", ".github/workflows/grid.yml"]

jobs:
  test:
    name: Grid tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest version pyproject.toml allows, and the newest.
        python: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: packages/grid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Tests and lint run in the image ./docker.sh builds, the same tools as locally.
      - name: Lint
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: ./docker.sh sh -c 'uv run --locked ruff check && uv run --locked ruff format --check'

      - name: Run tests
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: ./docker.sh uv run --locked pytest
