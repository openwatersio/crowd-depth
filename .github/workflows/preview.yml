name: Preview

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A slower older run would otherwise overwrite the bot comment with a stale link.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Publishes the plugin to pkg.pr.new so any commit can be installed on a
  # Signal K server before it is released. Needs the pkg.pr.new GitHub App
  # installed on the repository. Fork PRs are skipped so unreviewed code is
  # never served under the project's URL.
  plugin:
    name: Publish plugin preview
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # pkg.pr.new serves the preview under the PR's head SHA, so build that
      # commit rather than GitHub's merge commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: npm

      - run: npm ci

      # prepack builds the plugin.
      - run: npm exec -- pkg-pr-new publish --commentWithSha ./packages/signalk-plugin
