name: Grid

on:
  pull_request:
    # Also what ingest parses: the API's R2 keys and sidecars, and the plugin's uploads.
    paths:
      - "packages/grid/**"
      - ".github/workflows/grid.yml"
      - "packages/api/src/r2.ts"
      - "packages/signalk-plugin/src/reporters/noaa.ts"
  push:
    branches: [main]
    paths:
      - "packages/grid/**"
      - ".github/workflows/grid.yml"
      - "packages/api/src/r2.ts"
      - "packages/signalk-plugin/src/reporters/noaa.ts"

permissions:
  contents: read

jobs:
  test:
    name: Grid tests (Python ${{ matrix.python }}, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # The oldest version pyproject.toml allows, and the newest.
        python: ["3.12", "3.14"]
        # Each version's tests split across three jobs, which run at once.
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: packages/grid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Tests and lint run in the image ./docker.sh builds, the same tools as locally.
      - name: Lint
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: ./docker.sh sh -c 'uv run --locked ruff check && uv run --locked ruff format --check'

      # One worker per logical CPU: `-n auto` counts physical cores, two of the runner's four.
      - name: Run tests
        env:
          UV_PYTHON: ${{ matrix.python }}
        # Runners' CPUs differ from job to job, and their speed with them.
        run: |
          grep -m1 "model name" /proc/cpuinfo || true
          ./docker.sh uv run --locked pytest -n logical --shard ${{ matrix.shard }}/3 --durations=30
