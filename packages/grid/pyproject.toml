[project]
name = "grid"
version = "0.1.0"
description = "Crowd Depth global depth grid pipeline"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.38",
  # A newer DuckLake migrates the catalog it attaches, which an older build then can't read.
  "duckdb>=1.5,<1.6",
  "numpy>=2",
  "pmtiles>=3.4",
  "rasterio>=1.4",
  "scipy>=1.14",
  "shapely>=2.1",
  # Runs the per-tile rebuild (tiles.py). A new major version can change the flags
  # `grid tiles` passes and how Snakemake decides what reruns.
  "snakemake>=9.26.1,<10",
]

[project.scripts]
grid = "grid.cli:main"

[dependency-groups]
dev = ["pyarrow>=20", "pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
# Local previews, which docker.sh mounts without the repository's .gitignore.
extend-exclude = [".preview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
